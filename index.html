<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <!-- Left Sidebar -->
        <aside class="sidebar">

            <div class="logo-container">
                <img src="odin-lined (1).png" alt="Odin Logo">
                <h1>ODIN</h1>
            </div>

            <p class="photo-credit">
                Photo by
                <a href="#">Halie West</a>
                on
                <a href="#">Unsplash</a>
            </p>

        </aside>

        <!-- Right Content -->
        <main class="content">

            <!-- Introduction -->
            <div class="intro">
                <p>
                    This is not a real online service! You know you
                    need something like this in your life to help
                    you realize your deepest dreams.
                    Sign up <em>now</em> to get started.
                </p>

                <p>
                    You <em>know</em> you want to.
                </p>
            </div>

            <!-- Registration Form -->
            <form id="signup-form">

                <div class="form-section">
                    <h2>Let's do this!</h2>

                    <div class="form-fields">

                        <div class="form-group">
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name" name="firstName" required>
                        </div>

                        <div class="form-group">
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name" name="lastName" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </div>

                        <div class="form-group">
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" id="confirm-password" name="confirmPassword" required>
                        </div>

                    </div>
                </div>

                <!-- Submit and Login -->
                <div class="form-footer">

                    <button type="submit" class="create-button">
                        Create Account
                    </button>

                    <p class="login-text">
                        Already have an account?
                        <a href="login.html">Log in</a>
                    </p>

                </div>

            </form>

        </main>

    </div>

</body>

</html>
